# SonarQube Cloud's Automatic Analysis reads this file on every push to main.
# Only what we write and ship is graded. Each exclusion says what it hides.

# server/        generated from worker/ (worker/scripts/build-server.mjs); worker/ is analysed.
# site/assets/   the website's design kit, not the app.
# tools/         QA and emulator scripts run by hand on the owner's PC; the fake
#                provider and walks are meant to be open, permissive test servers.
# frontend/libs/ Spartan UI components copied in by its CLI (@spartan-ng/helm).
# Build output (dist/, www/, electron/app/) is ignored by git, so never reaches here.
sonar.exclusions=server/**,site/assets/**,tools/**,frontend/libs/**,**/dist/**,**/www/**,frontend/electron/app/**

# A deliberate copy of shared/errorReports.ts (the desktop build cannot reach shared/).
sonar.cpd.exclusions=frontend/electron/src/shared/**

# json:S2068 ("hard-coded password") fires on the word "password" in the
# translations. The files stay analysed; only that rule is off for them.
# Not documented for Automatic Analysis: if Sonar still reports it, set the same
# under Administration > Analysis Scope > Ignore Issues on Multiple Criteria.
sonar.issue.ignore.multicriteria=i18nPassword
sonar.issue.ignore.multicriteria.i18nPassword.ruleKey=json:S2068
sonar.issue.ignore.multicriteria.i18nPassword.resourceKey=frontend/src/app/i18n/*.json
