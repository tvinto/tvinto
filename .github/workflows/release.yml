# Releases from GitHub's runners: the web bundle, the Windows installer, the
# APK and the tvinto CLI, each with the project's own publish script, which
# refuses what it always has (docs/updates.md). The versions are bumped in a
# commit first; this reads them and changes none.
#
#   gh workflow run release.yml -f web=true -f desktop=true
#
# Or push a tag naming the parts: release-1.0.143-web-desktop (-web, -desktop,
# -apk, -cli). docs/building.md, "Releasing", has the rest.
name: Release

on:
  workflow_dispatch:
    inputs:
      web:
        description: Web bundle (frontend/package.json version)
        type: boolean
        default: false
      desktop:
        description: Windows installer (frontend/electron/package.json version)
        type: boolean
        default: false
      apk:
        description: APK (versionName in android/app/build.gradle)
        type: boolean
        default: false
      cli:
        description: tvinto CLI to npm (cli/package.json version)
        type: boolean
        default: false
      min_native:
        description: Web bundle only, --min-native (the oldest APK it runs on); empty for the APK being built
        type: string
        default: ''
  push:
    tags:
      - 'release-*'

permissions:
  contents: read

# One release at a time; never cancel one halfway through its uploads.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    name: What to release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      web: ${{ steps.what.outputs.web }}
      desktop: ${{ steps.what.outputs.desktop }}
      apk: ${{ steps.what.outputs.apk }}
      cli: ${{ steps.what.outputs.cli }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # Refused here, before half an hour of builds: nothing chosen, a release
      # that already exists (a version not bumped), an APK whose versionName is
      # not the web version. The publish scripts check all of it again.
      - id: what
        env:
          GH_TOKEN: ${{ github.token }}
          DISPATCH: ${{ github.event_name == 'workflow_dispatch' }}
          IN_WEB: ${{ inputs.web }}
          IN_DESKTOP: ${{ inputs.desktop }}
          IN_APK: ${{ inputs.apk }}
          IN_CLI: ${{ inputs.cli }}
          MIN_NATIVE: ${{ inputs.min_native }}
          TAG: ${{ github.ref_name }}
        run: |
          chosen() { # $1 input value, $2 tag word
            if [ "$DISPATCH" = true ]; then [ "$1" = true ] && echo true || echo false
            else case "$TAG" in *-"$2"|*-"$2"-*) echo true;; *) echo false;; esac; fi
          }
          web=$(chosen "$IN_WEB" web); desktop=$(chosen "$IN_DESKTOP" desktop)
          apk=$(chosen "$IN_APK" apk); cli=$(chosen "$IN_CLI" cli)
          printf 'web=%s\ndesktop=%s\napk=%s\ncli=%s\n' "$web" "$desktop" "$apk" "$cli" | tee -a "$GITHUB_OUTPUT"
          if [ "$web$desktop$apk$cli" = falsefalsefalsefalse ]; then
            echo "::error::Nothing chosen to release."; exit 1
          fi

          webv=$(node -p "require('./frontend/package.json').version")
          deskv=$(node -p "require('./frontend/electron/package.json').version")
          cliv=$(node -p "require('./cli/package.json').version")
          apkv=$(sed -n 's/^ *versionName "\(.*\)"/\1/p' frontend/android/app/build.gradle)
          echo "web $webv, desktop $deskv, APK $apkv, CLI $cliv"

          exists() { gh release view "$1" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; }
          failed=0
          if [ "$web" = true ] && exists "web-$webv"; then echo "::error::web-$webv is already released. Bump frontend/package.json."; failed=1; fi
          if [ "$desktop" = true ] && exists "desktop-$deskv"; then echo "::error::desktop-$deskv is already released. Bump frontend/electron/package.json."; failed=1; fi
          if [ "$apk" = true ] && exists "android-$apkv"; then echo "::error::android-$apkv is already released. Bump versionName and versionCode."; failed=1; fi
          if [ "$apk" = true ] && [ "$apkv" != "$webv" ]; then echo "::error::versionName $apkv is not the web version $webv; they must be the same."; failed=1; fi
          if [ "$web" = true ] && [ "$apk" = true ] && [ -z "$MIN_NATIVE" ]; then echo "::error::The APK carries web $webv itself; release it alone, or give min_native to offer this code to older APKs too."; failed=1; fi
          if [ "$cli" = true ] && [ "$(npm view "tvinto@$cliv" version 2>/dev/null)" = "$cliv" ]; then echo "::error::tvinto $cliv is already on npm. Bump cli/package.json."; failed=1; fi
          exit $failed

  checks:
    name: Checks
    needs: plan
    uses: ./.github/workflows/ci.yml

  web:
    name: Web bundle
    needs: [plan, checks]
    if: needs.plan.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm ci
        working-directory: frontend
      # Official builds report errors (docs/error-reports.md) and name no server.
      - name: config.local.json
        working-directory: frontend
        env:
          DSN: ${{ secrets.TVINTO_ERROR_REPORTS_DSN }}
        run: |
          [ -n "$DSN" ] || { echo "::error::Secret TVINTO_ERROR_REPORTS_DSN is not set."; exit 1; }
          node -e "require('fs').writeFileSync('config.local.json', JSON.stringify({ errorReportsDsn: process.env.DSN }))"
      - run: npm run build
        working-directory: frontend
      - name: Publish
        working-directory: frontend
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MIN_NATIVE: ${{ inputs.min_native }}
        run: npm run publish:bundle -- ${MIN_NATIVE:+--min-native "$MIN_NATIVE"}

  desktop:
    name: Windows installer
    needs: [plan, checks]
    if: needs.plan.outputs.desktop == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
            frontend/electron/package-lock.json
            cli/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm ci
        working-directory: frontend
      - run: npm ci
        working-directory: frontend/electron
      # The CLI the installer carries, with its keyring's native module.
      - run: npm ci
        working-directory: cli
      - name: config.local.json
        working-directory: frontend
        env:
          DSN: ${{ secrets.TVINTO_ERROR_REPORTS_DSN }}
        run: |
          [ -n "$DSN" ] || { echo "::error::Secret TVINTO_ERROR_REPORTS_DSN is not set."; exit 1; }
          node -e "require('fs').writeFileSync('config.local.json', JSON.stringify({ errorReportsDsn: process.env.DSN }))"
      - run: npm run build
        working-directory: frontend
      # copy, never sync: sync puts back the SQLite plugin the desktop cannot load.
      - run: npx cap copy electron
        working-directory: frontend
      # fetch:mpv (the deps-mpv-* release), build:player (fetches its own
      # pinned Zig; needs nothing installed but Windows' tar.exe), build:cli,
      # then the installer and latest.yml.
      - run: npm run electron:make
        working-directory: frontend/electron
      - name: Publish
        working-directory: frontend/electron
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run electron:publish

  apk:
    name: APK
    needs: [plan, checks]
    if: needs.plan.outputs.apk == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      # The runner image has the Android SDK (ANDROID_HOME); Gradle fetches
      # any platform or build-tools it lacks.
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: npm ci --ignore-scripts
      - run: npm ci
        working-directory: frontend
      - name: config.local.json
        working-directory: frontend
        env:
          DSN: ${{ secrets.TVINTO_ERROR_REPORTS_DSN }}
        run: |
          [ -n "$DSN" ] || { echo "::error::Secret TVINTO_ERROR_REPORTS_DSN is not set."; exit 1; }
          node -e "require('fs').writeFileSync('config.local.json', JSON.stringify({ errorReportsDsn: process.env.DSN }))"
      - run: npm run build
        working-directory: frontend
      # sync, not copy: Android needs its plugins registered.
      - run: npx cap sync android
        working-directory: frontend
      # The keystore lives outside the checkout for this job only. Every APK
      # published must carry the same key, or it cannot update the installed one.
      - name: Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.TVINTO_KEYSTORE_BASE64 }}
        run: |
          [ -n "$KEYSTORE_BASE64" ] || { echo "::error::Secret TVINTO_KEYSTORE_BASE64 is not set."; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/tvinto.keystore"
      # Arm only (-PforDevices); publish:apk refuses an APK carrying x86_64.
      - name: Build
        working-directory: frontend/android
        env:
          TVINTO_KEYSTORE: ${{ runner.temp }}/tvinto.keystore
          TVINTO_KEYSTORE_PASSWORD: ${{ secrets.TVINTO_KEYSTORE_PASSWORD }}
          TVINTO_KEY_ALIAS: ${{ secrets.TVINTO_KEY_ALIAS }}
          TVINTO_KEY_PASSWORD: ${{ secrets.TVINTO_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug -PforDevices --no-daemon
      - run: rm -f "$RUNNER_TEMP/tvinto.keystore"
        if: always()
      - name: Publish
        working-directory: frontend
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run publish:apk

  # npm's trusted publishing: no token, no 2FA prompt. npm checks that this
  # repository and this file (release.yml) are the package's trusted publisher.
  cli:
    name: tvinto CLI
    needs: [plan, checks]
    if: needs.plan.outputs.cli == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            cli/package-lock.json
      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@11.16.0
      - run: npm ci --ignore-scripts
      - run: npm ci --ignore-scripts
        working-directory: backend
      - run: npm ci --ignore-scripts
        working-directory: cli
      # Builds, tests and type-checks again, then publishes (with provenance).
      - run: npm run publish:cli -- --yes
        working-directory: cli
