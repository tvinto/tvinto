# Every push and pull request: the tests, the builds, and the checks that
# something generated has not drifted from its source. What CLAUDE.md lists
# under Commands, run the same way.
#
# The linters fail the run on anything, warnings included: both were brought
# to none on 27 October and stay there. Not here: the Android and desktop builds, which need
# signing and an SDK and are made on a user's machine.
name: CI

on:
  push:
  pull_request:
  # release.yml runs these checks before it builds anything.
  workflow_call:

permissions:
  contents: read

# The workflow's name keeps a release's checks out of the push runs' group:
# called from release.yml it is "Release", and a push would otherwise cancel them.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    # backend/'s Jest also runs shared/, worker/ and cli/ tests, and the guard
    # on source encoding (backend/src/utils/sourceEncoding.test.ts).
    name: Backend, shared, worker and CLI
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            worker/package-lock.json
            cli/package-lock.json
      # The root's one package is what shared/ imports (fast-xml-parser).
      # No install scripts: nothing these jobs run needs one (esbuild finds its
      # binary in its optional package; workerd is never started here).
      - run: npm ci --ignore-scripts
      - run: npm ci --ignore-scripts
        working-directory: backend
      - run: npm ci --ignore-scripts
        working-directory: worker
      - run: npm ci --ignore-scripts
        working-directory: cli
      - name: Lint
        run: ./node_modules/.bin/eslint . --max-warnings 0
        working-directory: backend
      - name: Tests
        run: ./node_modules/.bin/jest
        working-directory: backend
      - name: The CLI's types (esbuild checks none)
        run: backend/node_modules/.bin/tsc -p cli
      - name: server/ is the Worker as it stands
        run: node worker/scripts/build-server.mjs --check

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
            frontend/electron/package-lock.json
      - run: npm ci --ignore-scripts
      # The Angular build keeps its install scripts (nx, lmdb, @parcel/watcher).
      - run: npm ci
        working-directory: frontend
      # The desktop app's tests type-check against Electron's types; its
      # binary is not needed for that.
      - run: npm ci --ignore-scripts
        working-directory: frontend/electron
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - name: Lint
        run: ./node_modules/.bin/eslint . --max-warnings 0
        working-directory: frontend
      - name: Tests
        run: ./node_modules/.bin/jest
        working-directory: frontend
      - name: Build
        run: npm run build
        working-directory: frontend
